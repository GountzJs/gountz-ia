<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gz-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0f172a" stroke="url(#gz-grad)" stroke-width="3"/>
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#gz-glow)"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="24" cy="25" r="3.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="34" cy="25" r="3.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="44" cy="25" r="3.5" fill="#10b981" opacity="0.85"/>
  
  <!-- Terminal Prompt Chevron & Robot/Circuit Lines -->
  <path d="M26 44 L40 54 L26 64" stroke="url(#gz-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="46" y1="64" x2="68" y2="64" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Microkernel Core Node -->
  <circle cx="72" cy="42" r="5" fill="#818cf8"/>
  <path d="M72 47 L72 58" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 2"/>
</svg>
