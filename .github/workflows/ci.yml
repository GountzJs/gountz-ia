name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Build Binary
        run: |
          mkdir -p bin
          go build -v -o bin/gz-ia ./cmd/gz-ia

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install Docs Dependencies
        run: cd docs && npm ci

      - name: Build Documentation (VitePress)
        run: cd docs && npm run docs:build

      - name: Deploy Documentation to Cloudflare Pages
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'pull_request' && env.HAS_CF_TOKEN == 'true')
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME || vars.CLOUDFLARE_PROJECT_NAME || 'gz-ia' }}
          directory: docs/.vitepress/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
